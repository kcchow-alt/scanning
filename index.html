<meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  ><meta name="theme-color" content="#1a73e8">
<title></title>
<!-- QR Scanner library --><script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript"
  ></script>
<style type="text/css">:root {
      --blue: #1a73e8;
      --blue-dark: #174ea6;
      --green: #188038;
      --red: #d93025;
      --orange: #e37400;
      --grey: #5f6368;
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #202124;
      --line: #dadce0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .container {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    header {
      padding: 20px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.95;
    }

    .card {
      margin-top: 16px;
      padding: 18px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 2px 7px rgba(60, 64, 67, 0.14);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #ffffff;
      color: var(--text);
      font-size: 17px;
    }

    input:focus {
      outline: 3px solid rgba(26, 115, 232, 0.18);
      border-color: var(--blue);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 15px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.96);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-green {
      background: var(--green);
    }

    .btn-grey {
      background: var(--grey);
    }

    .btn-orange {
      background: var(--orange);
    }

    .btn-red {
      background: var(--red);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      margin-top: 14px;
      border-radius: 12px;
    }

    .help-text {
      margin: 10px 0 0;
      color: var(--grey);
      font-size: 13px;
      line-height: 1.55;
    }

    #studentCard {
      display: none;
    }

    .student-title {
      margin: 0 0 12px;
      color: var(--blue-dark);
      font-size: 25px;
    }

    .student-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 520px) {
      .student-details {
        grid-template-columns: 1fr;
      }
    }

    .detail-box {
      padding: 11px;
      background: #f8f9fa;
      border-radius: 10px;
      font-size: 13px;
    }

    .detail-box strong {
      display: block;
      margin-top: 4px;
      font-size: 17px;
    }

    .code-value {
      word-break: break-all;
      font-size: 12px !important;
    }

    .separator {
      height: 1px;
      margin: 18px 0;
      background: var(--line);
    }

    #statusBox {
      display: none;
      margin-top: 16px;
      padding: 15px;
      border-radius: 11px;
      font-weight: 700;
      line-height: 1.6;
      white-space: pre-line;
    }

    .status-info {
      color: #174ea6;
      border: 1px solid #aecbfa;
      background: #e8f0fe;
    }

    .status-success {
      color: #137333;
      border: 1px solid #a8dab5;
      background: #e6f4ea;
    }

    .status-warning {
      color: #8a4b00;
      border: 1px solid #fdd663;
      background: #fef7e0;
    }

    .status-error {
      color: #b3261e;
      border: 1px solid #f6aea9;
      background: #fce8e6;
    }

    #dashboard {
      display: none;
    }

    .dashboard-table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    th {
      color: #174ea6;
      background: #e8f0fe;
    }

    tfoot td {
      font-weight: 700;
      background: #e6f4ea;
    }

    .footer {
      padding: 20px 6px;
      color: var(--grey);
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }
</style>
<main class="container">
<header>
<h1>QR Code 即時簽到系統</h1>

<div class="subtitle">用相機、外接 QR Scanner 或手動輸入 Unique Code，記錄學生及家人到場資料。</div>
</header>

<section class="card">
<div class="grid">
<div><label for="operatorName">簽到職員／入口名稱</label> <input autocomplete="name" id="operatorName" placeholder="例如：Main Gate A" type="text" /></div>

<div><label for="manualCode">QR Code／Unique Code</label> <input autocapitalize="characters" autocomplete="off" id="manualCode" placeholder="掃描或輸入 Unique Code" type="text" /></div>
</div>

<div class="button-row"><button id="lookupButton" onclick="lookupManualCode()">查詢 QR Code</button><button class="btn-grey" id="cameraButton" onclick="toggleCamera()">開啟相機掃描</button><button class="btn-orange" onclick="refreshDashboard()">更新即時統計</button></div>

<div id="reader">&nbsp;</div>

<p class="help-text">建議現場同時準備外接藍牙／USB QR Scanner。外接 Scanner 會把 QR Code 視為鍵盤輸入，通常比手機相機更快、更穩定。</p>
</section>

<section class="card" id="studentCard">
<h2 class="student-title" id="studentName">&nbsp;</h2>

<div class="student-details">
<div class="detail-box">班別及班號</div>

<div class="detail-box">原登記總人數</div>

<div class="detail-box">原登記家人人數</div>

<div class="detail-box">Unique Code</div>
</div>

<div class="separator">&nbsp;</div>

<div class="grid">
<div><label for="familyAttendees">實際到場家人人數（不包括學生） </label> <input id="familyAttendees" min="0" step="1" type="number" value="0" /></div>

<div><label>快速設定</label>

<div class="button-row" style="margin-top: 0;"><button class="btn-grey" onclick="setFamilyCount(0)">只有學生</button><button class="btn-orange" onclick="setFullAttendance()">全數到場</button></div>
</div>
</div>

<div class="button-row"><button class="btn-green" id="checkInButton" onclick="confirmCheckIn()">確認簽到</button><button class="btn-grey" onclick="clearCurrentStudent()">取消／下一位</button></div>
</section>

<div id="statusBox">&nbsp;</div>

<section class="card" id="dashboard">
<h2 style="margin-top: 0;">即時出席統計</h2>

<div class="dashboard-table-wrap">
<table>
	<thead>
		<tr>
			<th>班別</th>
			<th>登記學生</th>
			<th>已到學生</th>
			<th>登記總人數</th>
			<th>已到家人</th>
			<th>實際總到場</th>
			<th>學生出席率</th>
		</tr>
	</thead>
	<tbody id="dashboardBody">
	</tbody>
	<tfoot id="dashboardFoot">
	</tfoot>
</table>
</div>

<p class="help-text" id="dashboardUpdatedAt">&nbsp;</p>
</section>

<div class="footer">QR Code 僅使用 Unique Code 驗證，不應直接存放學生姓名、班別或家人資料。</div>
</main>
<script>
    /*
     * ==========================================================
     * REQUIRED CONFIGURATION
     * ==========================================================
     *
     * Paste your deployed Google Apps Script Web App /exec URL.
     *
     * Correct:
     * https://script.google.com/macros/s/AKfycb.../exec
     *
     * Do NOT use:
     * - /dev URL
     * - Apps Script editor URL
     * - Google Sheet URL
     */
    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbxTc0nMar8R7rqDe_puxJ71r8gM_PjAUyaxllJgHy5qa9khKoWeKB6aEU2yf4cefKqR/exec';


    let currentStudent = null;
    let html5QrCode = null;
    let cameraRunning = false;
    let lookupInProgress = false;


    window.addEventListener('load', () => {
      loadSavedOperator();

      document
        .getElementById('operatorName')
        .addEventListener('input', saveOperator);

      document
        .getElementById('manualCode')
        .addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            lookupManualCode();
          }
        });

      refreshDashboard();

      const urlParams = new URLSearchParams(window.location.search);
      const codeFromUrl = urlParams.get('code');

      if (codeFromUrl) {
        document.getElementById('manualCode').value = codeFromUrl;
        lookupCode(codeFromUrl);
      }
    });


    function loadSavedOperator() {
      const savedName = localStorage.getItem('qrCheckinOperator') || '';
      document.getElementById('operatorName').value = savedName;
    }


    function saveOperator() {
      const name = document.getElementById('operatorName').value.trim();

      localStorage.setItem('qrCheckinOperator', name);
    }


    function showStatus(message, type = 'info') {
      const box = document.getElementById('statusBox');

      box.className = `status-${type}`;
      box.textContent = message;
      box.style.display = 'block';

      box.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
      });
    }


    function hideStatus() {
      document.getElementById('statusBox').style.display = 'none';
    }


    function validateApiUrl() {
      if (
        !GAS_API_URL ||
        GAS_API_URL.includes('PASTE_YOUR_GOOGLE_APPS_SCRIPT_EXEC_URL_HERE')
      ) {
        showStatus(
          '請先在 scanner.html 設定 GAS_API_URL，填入 Google Apps Script 的 /exec 網址。',
          'error'
        );

        return false;
      }

      return true;
    }


    async function apiGet(parameters) {
      const url = new URL(GAS_API_URL);

      Object.entries(parameters).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });

      const response = await fetch(url.toString(), {
        method: 'GET',
        redirect: 'follow',
      });

      if (!response.ok) {
        throw new Error(`API HTTP ${response.status}`);
      }

      return response.json();
    }


    async function apiPost(payload) {
      /*
       * Content-Type must stay text/plain.
       *
       * Do not change it to application/json:
       * that would normally trigger a browser CORS preflight request,
       * and Apps Script Web Apps do not reliably process OPTIONS requests.
       */
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        throw new Error(`API HTTP ${response.status}`);
      }

      return response.json();
    }


    function lookupManualCode() {
      const code = document.getElementById('manualCode').value.trim();

      lookupCode(code);
    }


    async function lookupCode(code) {
      if (!validateApiUrl()) {
        return;
      }

      if (!code) {
        showStatus('請掃描或輸入 QR Code。', 'warning');
        return;
      }

      if (lookupInProgress) {
        return;
      }

      lookupInProgress = true;
      hideStatus();

      const button = document.getElementById('lookupButton');

      button.disabled = true;
      button.textContent = '查詢中…';

      try {
        const result = await apiGet({
          action: 'lookup',
          code: code,
        });

        if (!result.ok) {
          clearCurrentStudent(false);

          showStatus(
            result.message || '找不到這個 QR Code。',
            'error'
          );

          return;
        }

        displayStudent(result.student);
        await stopCamera();

      } catch (error) {
        showStatus(
          `查詢失敗：${error.message}`,
          'error'
        );

      } finally {
        lookupInProgress = false;
        button.disabled = false;
        button.textContent = '查詢 QR Code';
      }
    }


    function displayStudent(student) {
      currentStudent = student;

      document.getElementById('studentCard').style.display = 'block';

      document.getElementById('studentName').textContent =
        student.studentName;

      document.getElementById('studentClass').textContent =
        `${student.className} - ${student.classNumber}`;

      document.getElementById('registeredGroup').textContent =
        `${student.groupSize} 人`;

      document.getElementById('registeredFamily').textContent =
        `${Math.max(0, Number(student.groupSize) - 1)} 人`;

      document.getElementById('studentCode').textContent =
        student.uniqueCode;

      document.getElementById('familyAttendees').value = 0;

      showStatus(
        '已找到學生資料。請輸入實際到場家人人數，然後確認簽到。',
        'info'
      );

      document.getElementById('studentCard').scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
      });
    }


    function setFamilyCount(value) {
      document.getElementById('familyAttendees').value = value;
    }


    function setFullAttendance() {
      if (!currentStudent) {
        return;
      }

      const registeredFamily =
        Math.max(0, Number(currentStudent.groupSize) - 1);

      setFamilyCount(registeredFamily);
    }


    async function confirmCheckIn() {
      if (!validateApiUrl()) {
        return;
      }

      if (!currentStudent) {
        showStatus('請先掃描或查詢 QR Code。', 'warning');
        return;
      }

      const operatorName =
        document.getElementById('operatorName').value.trim();

      const familyAttendees =
        document.getElementById('familyAttendees').value;

      if (!operatorName) {
        showStatus(
          '請先填寫「簽到職員／入口名稱」。',
          'warning'
        );

        document.getElementById('operatorName').focus();

        return;
      }

      const button = document.getElementById('checkInButton');

      button.disabled = true;
      button.textContent = '正在寫入…';

      try {
        const result = await apiPost({
          action: 'checkin',
          uniqueCode: currentStudent.uniqueCode,
          familyAttendees: familyAttendees,
          operatorName: operatorName,
        });

        if (!result.ok) {
          const statusType =
            result.status === 'ALREADY_CHECKED_IN'
              ? 'warning'
              : 'error';

          showStatus(
            result.message || '簽到未能完成。',
            statusType
          );

          return;
        }

        const student = result.student;

        showStatus(
          `✓ 簽到成功\n` +
          `${student.className}-${student.classNumber} ` +
          `${student.studentName}\n` +
          `學生：1 人；家人：${student.familyAttendees} 人；` +
          `合共：${student.totalAttendees} 人\n` +
          `時間：${student.checkInTime}`,
          'success'
        );

        clearCurrentStudent(false);

        document.getElementById('manualCode').value = '';
        document.getElementById('manualCode').focus();

        refreshDashboard();

      } catch (error) {
        showStatus(
          `簽到失敗：${error.message}`,
          'error'
        );

      } finally {
        button.disabled = false;
        button.textContent = '確認簽到';
      }
    }


    function clearCurrentStudent(clearInput = true) {
      currentStudent = null;

      document.getElementById('studentCard').style.display = 'none';

      if (clearInput) {
        document.getElementById('manualCode').value = '';
      }
    }


    async function toggleCamera() {
      if (cameraRunning) {
        await stopCamera();
      } else {
        await startCamera();
      }
    }


    async function startCamera() {
      if (typeof Html5Qrcode === 'undefined') {
        showStatus(
          '無法載入 QR 掃描元件。請檢查網絡連線，或改用外接 Scanner／手動輸入。',
          'error'
        );

        return;
      }

      try {
        html5QrCode = new Html5Qrcode('reader');

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error('找不到可用相機。');
        }

        const preferredCamera =
          cameras.find((camera) =>
            /back|rear|environment/i.test(camera.label)
          ) || cameras[cameras.length - 1];

        await html5QrCode.start(
          preferredCamera.id,
          {
            fps: 10,
            qrbox: {
              width: 260,
              height: 260,
            },
            aspectRatio: 1,
          },
          async (decodedText) => {
            document.getElementById('manualCode').value = decodedText;

            await stopCamera();

            lookupCode(decodedText);
          },
          () => {
            // Ignore scan-frame failures while the user aims the camera.
          }
        );

        cameraRunning = true;

        document.getElementById('cameraButton').textContent =
          '關閉相機掃描';

        showStatus(
          '相機已開啟。請把 QR Code 放在掃描框內。',
          'info'
        );

      } catch (error) {
        document.getElementById('reader').innerHTML = '';

        html5QrCode = null;
        cameraRunning = false;

        showStatus(
          `無法開啟相機：${error.message || error}\n` +
          '請確認：網站正在使用 HTTPS、瀏覽器已允許相機權限，並且不是在 App 內置瀏覽器開啟。',
          'error'
        );
      }
    }


    async function stopCamera() {
      if (!html5QrCode || !cameraRunning) {
        return;
      }

      try {
        await html5QrCode.stop();
      } catch (error) {
        // Ignore errors caused by a camera already being stopped.
      }

      try {
        await html5QrCode.clear();
      } catch (error) {
        // Ignore visual clean-up errors.
      }

      html5QrCode = null;
      cameraRunning = false;

      document.getElementById('cameraButton').textContent =
        '開啟相機掃描';

      document.getElementById('reader').innerHTML = '';
    }


    async function refreshDashboard() {
      if (!validateApiUrl()) {
        return;
      }

      try {
        const result = await apiGet({
          action: 'dashboard',
        });

        if (!result.ok) {
          throw new Error(result.message || '未能取得即時統計。');
        }

        renderDashboard(result);

      } catch (error) {
        console.error(error);
      }
    }


    function renderDashboard(data) {
      const dashboard = document.getElementById('dashboard');
      const body = document.getElementById('dashboardBody');
      const foot = document.getElementById('dashboardFoot');

      body.innerHTML = '';

      data.classes.forEach((item) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${escapeHtml(item.className)}</td>
          <td>${item.registeredStudents}</td>
          <td>${item.studentsAttended}</td>
          <td>${item.registeredPeople}</td>
          <td>${item.familyAttendees}</td>
          <td>${item.totalAttendees}</td>
          <td>${formatPercent(item.attendanceRate)}</td>
        `;

        body.appendChild(row);
      });

      foot.innerHTML = `
        <tr>
          <td>Total</td>
          <td>${data.total.registeredStudents}</td>
          <td>${data.total.studentsAttended}</td>
          <td>${data.total.registeredPeople}</td>
          <td>${data.total.familyAttendees}</td>
          <td>${data.total.totalAttendees}</td>
          <td>${formatPercent(data.total.attendanceRate)}</td>
        </tr>
      `;

      document.getElementById('dashboardUpdatedAt').textContent =
        `最後更新：${data.updatedAt}`;

      dashboard.style.display = 'block';
    }


    function formatPercent(value) {
      return `${(Number(value || 0) * 100).toFixed(1)}%`;
    }


    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
